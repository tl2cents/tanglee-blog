{% assign academic_home = site.academic_url | default: 'https://tang.cat/' %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Homepage · Lili Tang</title>
  <link rel="canonical" href="{{ academic_home | escape }}">
  <meta http-equiv="refresh" content="2; url={{ academic_home | escape }}">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f7f4; color: #253642; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    a { color: #2a645f; text-underline-offset: .2em; }
  </style>
  <script>
    (function () {
      var destination = new URL({{ academic_home | jsonify }}, window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Lili Tang · Academic Homepage</h1>
    <p>Opening my academic homepage…</p>
    <p><a href="{{ academic_home | escape }}">Continue to the academic homepage</a></p>
  </main>
</body>
</html>
